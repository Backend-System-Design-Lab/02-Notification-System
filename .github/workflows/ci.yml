name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-smoke:
    name: Build, Test and Smoke Test

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission
        run: chmod +x gradlew scripts/*.sh

      - name: Verify Java and Gradle
        run: |
          java --version
          ./gradlew --version

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Verify executable JAR
        run: test -f build/libs/app.jar

      - name: Validate Docker Compose
        run: docker compose --profile test config

      - name: Build application image
        run: docker compose build app

      - name: Start application container
        run: docker compose up -d app

      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            container_id="$(docker compose ps -q app)"

            if [[ -n "$container_id" ]]; then
              status="$(
                docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                  "$container_id"
              )"

              echo "Attempt ${attempt}: health=${status}"

              if [[ "$status" == "healthy" ]]; then
                exit 0
              fi
            fi

            sleep 2
          done

          echo "Application did not become healthy."
          docker compose logs app
          exit 1

      - name: Run k6 Smoke Test
        run: |
          docker compose --profile test run \
            --rm \
            --no-deps \
            k6 run /scripts/smoke-test.js

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up containers
        if: always()
        run: |
          docker compose --profile test down \
            -v \
            --remove-orphans